name: submission
description: "Food Recognizer App"

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Image Capture (Criterion 1)
  image_picker: ^1.1.2
  image_cropper: ^12.1.1
  camera: ^0.11.1

  # ML / LiteRT (Criterion 2) — flutter_litert replaces deprecated tflite_flutter
  flutter_litert: ^2.0.11
  image: ^4.5.2

  # Firebase (Criterion 2 - Advanced)
  firebase_core: ^4.1.1
  firebase_ml_model_downloader: ^0.4.0+2

  # Networking (Criterion 3)
  http: ^1.2.2

  # Gemini AI (Criterion 3 - Advanced)
  google_generative_ai: ^0.4.6

  # Environment
  envied: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.13.1
  envied_generator: ^1.3.4

flutter:
  uses-material-design: true
  assets:
    - assets/
